server:
  address: 127.0.0.1
  port: ${TOURMATE_TOOLS_PORT:18090}
spring:
  application:
    name: tourmate-tools-server
  ai:
    mcp:
      server:
        name: tourmate-travel-tools
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
