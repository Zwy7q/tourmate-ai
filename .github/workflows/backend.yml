name: 后端测试
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            tools-server/pom.xml
      - name: 执行离线测试和打包
        working-directory: backend
        run: mvn -B -s maven-central-settings.xml clean verify
      - name: 执行 MCP 工具服务测试和打包
        working-directory: tools-server
        run: mvn -B -s ../backend/maven-central-settings.xml clean verify
